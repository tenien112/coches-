name: sonda
on:
  push:
    paths: ['tmp/sonda.py','.github/workflows/sonda.yml']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tmp/sonda.py
      - run: |
          git config user.name "coches-bot"; git config user.email "bot@users.noreply.github.com"
          git add sonda; git commit -m "sonda" || true; git pull -q --rebase; git push
