name: sonda
on:
  push:
    paths: ['scripts/sonda.py','.github/workflows/sonda.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/sonda.py
      - run: |
          git config user.name "coches-bot"; git config user.email "bot@users.noreply.github.com"
          git add sonda; git commit -m "sonda" || true; git push
